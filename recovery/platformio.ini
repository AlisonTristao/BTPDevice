; The recovery firmware, one environment per chip. tools/pio_recovery.py
; builds the one matching the application's chip; by hand:
;   pio run -d recovery -e esp32s3
[platformio]
src_dir = main

[env]
platform = espressif32
framework = espidf
board_build.partitions = ../partitions/tracekit_4mb.csv
board_upload.flash_size = 4MB
; The page at / (main/CMakeLists.txt EMBED_TXTFILES): PlatformIO needs it too.
board_build.embed_txtfiles = main/page.html

[env:esp32]
board = esp32dev

[env:esp32s2]
board = esp32-s2-saola-1

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32c6]
board = esp32-c6-devkitc-1
