<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTP recovery</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1c2230;--mut:#667085;--acc:#2458d6;--ok:#15803d;--err:#c62828;--bd:#d6dae1}
@media (prefers-color-scheme:dark){:root{--bg:#0f1217;--card:#181c23;--fg:#e5e7eb;--mut:#98a2b3;--acc:#6ea0ff;--ok:#4ade80;--err:#f87171;--bd:#2b313c}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
h1{font-size:1.2rem;margin:0 0 2px}
.mut{color:var(--mut);font-size:.9rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0}
dt{color:var(--mut)}dd{margin:0;overflow-wrap:anywhere}
label{display:block;margin:12px 0 4px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--acc);border-color:var(--bd)}
button:disabled{opacity:.45;cursor:default}
progress{width:100%;height:10px;margin-top:14px}
#msg{margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.ok{color:var(--ok)}.err{color:var(--err)}
</style>
</head>
<body>
<main>
<div class="card">
<h1 id="title">BTP recovery</h1>
<div class="mut" id="sub">carregando…</div>
<dl id="info"></dl>
</div>
<div class="card">
<label for="file">Firmware (.bin)</label>
<input id="file" type="file" accept=".bin,application/octet-stream">
<div id="pwbox">
<label for="pw">Senha E</label>
<input id="pw" type="password" autocomplete="current-password">
<div class="mut">A senha não sai deste aparelho: só a assinatura do envio vai para o dispositivo.</div>
</div>
<div class="row">
<button id="send" disabled>Enviar firmware</button>
<button id="back" class="sec" disabled>Voltar ao app</button>
</div>
<progress id="bar" max="1" value="0" hidden></progress>
<div id="msg"></div>
</div>
</main>
<script>
"use strict";
// --- crypto (tested by tools/test_btp_ota.py against Python's hashlib) ---
// crypto.subtle only exists on https:// and localhost, never on the
// device's http:// page, so SHA-256, HMAC and PBKDF2 are written out here.
const K = Int32Array.of(
 0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
 0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
 0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
 0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
 0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
 0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
 0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
 0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2);
const IV = Int32Array.of(0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19);
const W = new Int32Array(64);

// One compression of the 16 big-endian words `m` into the state `h`.
function block(h, m) {
  for (let i = 0; i < 16; i++) W[i] = m[i];
  for (let i = 16; i < 64; i++) {
    const x = W[i - 15], y = W[i - 2];
    const s0 = (x >>> 7 | x << 25) ^ (x >>> 18 | x << 14) ^ (x >>> 3);
    const s1 = (y >>> 17 | y << 15) ^ (y >>> 19 | y << 13) ^ (y >>> 10);
    W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
  }
  let a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], k = h[7];
  for (let i = 0; i < 64; i++) {
    const t1 = (k + ((e >>> 6 | e << 26) ^ (e >>> 11 | e << 21) ^ (e >>> 25 | e << 7)) +
                ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
    const t2 = (((a >>> 2 | a << 30) ^ (a >>> 13 | a << 19) ^ (a >>> 22 | a << 10)) +
                ((a & b) ^ (a & c) ^ (b & c))) | 0;
    k = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
  }
  h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
  h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + k) | 0;
}

class Sha256 {
  constructor() { this.h = IV.slice(); this.buf = new Uint8Array(64); this.n = 0; this.len = 0; this.m = new Int32Array(16); }
  _take(b, o) {
    const m = this.m;
    for (let j = 0; j < 16; j++, o += 4) m[j] = b[o] << 24 | b[o + 1] << 16 | b[o + 2] << 8 | b[o + 3];
    block(this.h, m);
  }
  update(d) {
    let i = 0;
    this.len += d.length;
    if (this.n > 0) {
      while (this.n < 64 && i < d.length) this.buf[this.n++] = d[i++];
      if (this.n < 64) return this;
      this._take(this.buf, 0);
      this.n = 0;
    }
    for (; i + 64 <= d.length; i += 64) this._take(d, i);
    while (i < d.length) this.buf[this.n++] = d[i++];
    return this;
  }
  digest() {
    const bits = this.len * 8;
    const pad = new Uint8Array((this.n < 56 ? 56 : 120) - this.n + 8);
    pad[0] = 0x80;
    const hi = Math.floor(bits / 4294967296), lo = bits >>> 0, L = pad.length;
    pad[L - 8] = hi >>> 24; pad[L - 7] = hi >>> 16; pad[L - 6] = hi >>> 8; pad[L - 5] = hi;
    pad[L - 4] = lo >>> 24; pad[L - 3] = lo >>> 16; pad[L - 2] = lo >>> 8; pad[L - 1] = lo;
    this.update(pad);
    return wordsToBytes(this.h);
  }
}

function wordsToBytes(w) {
  const out = new Uint8Array(w.length * 4);
  for (let i = 0; i < w.length; i++) {
    out[4 * i] = w[i] >>> 24; out[4 * i + 1] = w[i] >>> 16; out[4 * i + 2] = w[i] >>> 8; out[4 * i + 3] = w[i];
  }
  return out;
}

function concat(...parts) {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}

function sha256(data) { return new Sha256().update(data).digest(); }

function padKey(key) {
  const k = new Uint8Array(64);
  k.set(key.length > 64 ? sha256(key) : key);
  const ip = k.map(x => x ^ 0x36), op = k.map(x => x ^ 0x5c);
  return [ip, op];
}

function hmac(key, msg) {
  const [ip, op] = padKey(key);
  return sha256(concat(op, new Sha256().update(ip).update(msg).digest()));
}

// PBKDF2-HMAC-SHA256 with dkLen <= 32 (one block). Iterations after the first
// reuse the precomputed inner and outer states: two compressions each.
function pbkdf2(password, salt, iterations, dkLen) {
  const [ip, op] = padKey(password);
  const si = new Sha256().update(ip).h, so = new Sha256().update(op).h;
  const u = new Int32Array(8), t = new Int32Array(8), h = new Int32Array(8), m = new Int32Array(16);
  const first = hmac(password, concat(salt, Uint8Array.of(0, 0, 0, 1)));
  for (let i = 0; i < 8; i++) u[i] = first[4 * i] << 24 | first[4 * i + 1] << 16 | first[4 * i + 2] << 8 | first[4 * i + 3];
  t.set(u);
  m[8] = 0x80000000 | 0; m[15] = (64 + 32) * 8;
  for (let n = 1; n < iterations; n++) {
    m.set(u); h.set(si); block(h, m);
    m.set(h); h.set(so); block(h, m);
    u.set(h);
    for (let i = 0; i < 8; i++) t[i] ^= u[i];
  }
  return wordsToBytes(t).slice(0, dkLen);
}

const utf8 = s => new TextEncoder().encode(s);
const hex = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
const unhex = s => Uint8Array.from(s.match(/../g) || [], x => parseInt(x, 16));

// tools/provision_key.py derive_key() and btp_ota.py auth_mac().
const deriveKey = password => pbkdf2(utf8(password), utf8("bally-kdf-salt-1"), 200000, 16);
const authMac = (keyE, nonce, action, sha) => hex(hmac(keyE, concat(utf8("btp-ota-1"), nonce, utf8(action), sha)));
// --- end crypto ---

if (typeof document !== "undefined") {
  const $ = id => document.getElementById(id);
  const REASONS = {
    command: "pedido pelo comando btp -recovery",
    crash_loop: "o app travou várias vezes seguidas",
    factory_reset: "factory reset (app e arquivos apagados)",
    factory_reset_all: "factory reset completo (sem chave: só por USB)",
    none: "entrada manual",
  };
  let status = null;
  let cached = { password: null, key: null };
  let working = false;

  function say(text, cls) { $("msg").textContent = text; $("msg").className = cls || ""; }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function getStatus() {
    const r = await fetch("/status", { cache: "no-store" });
    if (!r.ok) throw new Error("GET /status: " + r.status);
    return r.json();
  }

  function render() {
    const s = status;
    $("title").textContent = s.name || "BTP recovery";
    $("sub").textContent = "recovery " + s.recovery + " · " + s.chip;
    const rows = [
      ["App", s.app.valid ? s.app.project + " " + s.app.version : "nenhum (envie um firmware)"],
      ["Motivo", REASONS[s.reason] || s.reason],
      ["Máximo", (s.max_size / 1048576).toFixed(2) + " MB"],
      ["Autenticação", s.auth === "hmac-sha256" ? "senha E" : s.auth === "none" ? "nenhuma (build de bancada)" : "sem chave no dispositivo"],
    ];
    $("info").replaceChildren(...rows.flatMap(([k, v]) => {
      const dt = document.createElement("dt"), dd = document.createElement("dd");
      dt.textContent = k; dd.textContent = v;
      return [dt, dd];
    }));
    $("pwbox").hidden = s.auth !== "hmac-sha256";
    const usable = s.auth !== "unavailable" && !working;
    $("send").disabled = !usable || !s.ota_ready;
    $("back").disabled = !usable || !s.app.valid;
    if (s.auth === "unavailable") {
      say("O dispositivo não tem chave no NVS e recusa uploads. Grave a chave (tools/provision_key.py) e rode o app uma vez, ou atualize por USB.", "err");
    }
  }

  async function refresh() {
    try { status = await getStatus(); render(); }
    catch (e) { $("sub").textContent = "sem resposta do dispositivo"; }
  }

  async function keyE() {
    if (status.auth !== "hmac-sha256") return null;
    const password = $("pw").value;
    if (!password) throw new Error("Digite a senha E.");
    if (cached.password !== password) {
      say("Derivando a chave da senha…");
      await sleep(30);  // let the message paint: PBKDF2 blocks for a second or two
      cached = { password, key: deriveKey(password) };
    }
    return cached.key;
  }

  function checkImage(bytes) {
    if (bytes.length === 0) return "Arquivo vazio.";
    if (bytes.length > status.max_size) return "O arquivo tem " + bytes.length + " bytes; o app cabe em " + status.max_size + ".";
    if (bytes[0] !== 0xe9) return "Não é uma imagem de app ESP (falta o byte 0xE9). Use o firmware.bin do build, não o merged nem o bootloader.";
    const chip = bytes[12] | bytes[13] << 8;
    if (status.chip_id !== undefined && chip !== status.chip_id) return "Firmware compilado para outro chip (este é " + status.chip + ").";
    return null;
  }

  function post(path, headers, body, onProgress) {
    return new Promise((resolve, reject) => {
      const x = new XMLHttpRequest();
      x.open("POST", path);
      for (const [k, v] of Object.entries(headers)) x.setRequestHeader(k, v);
      if (onProgress) x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
      x.onload = () => resolve({ ok: x.status === 200, status: x.status, text: x.responseText });
      x.onerror = () => reject(new Error("a conexão caiu"));
      x.send(body);
    });
  }

  async function run(task) {
    if (working) return;
    working = true; render();
    try { await task(); }
    catch (e) { say(e.message, "err"); }
    finally { working = false; $("bar").hidden = true; await refresh(); }
  }

  $("send").onclick = () => run(async () => {
    const file = $("file").files[0];
    if (!file) throw new Error("Escolha o arquivo .bin.");
    const bytes = new Uint8Array(await file.arrayBuffer());
    const problem = checkImage(bytes);
    if (problem) throw new Error(problem);
    const key = await keyE();
    const sha = sha256(bytes);
    status = await getStatus();  // a fresh nonce, used once
    const headers = { "Content-Type": "application/octet-stream", "X-OTA-SHA256": hex(sha) };
    if (key) headers["X-OTA-Auth"] = authMac(key, unhex(status.nonce), "U", sha);
    say("Enviando " + file.name + "…");
    $("bar").hidden = false; $("bar").value = 0;
    const r = await post("/update", headers, bytes, p => { $("bar").value = p; });
    if (!r.ok) throw new Error(r.status === 401 ? r.text + "\n\nConfira a senha E." : r.text);
    say(r.text + "\nO dispositivo está reiniciando no app; esta página deixa de responder.", "ok");
  });

  $("back").onclick = () => run(async () => {
    const key = await keyE();
    status = await getStatus();
    const headers = {};
    if (key) headers["X-OTA-Auth"] = authMac(key, unhex(status.nonce), "B", new Uint8Array(32));
    const r = await post("/reboot", headers, "");
    if (!r.ok) throw new Error(r.text);
    say(r.text, "ok");
  });

  refresh();
  setInterval(() => { if (!working) refresh(); }, 5000);
}
</script>
</body>
</html>
