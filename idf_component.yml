version: "0.1.0"
description: "Makes an ESP32 a BTP device for TraceView: telemetry, terminal, commands, encryption and discovery by name."
url: https://github.com/AlisonTristao/TraceKit
license: MIT
dependencies:
  idf: ">=6.0"
  # Protocol and shell, fetched from GitHub at a pinned tag. The key is the
  # component name the CMakeLists.txt requires (REQUIRES BTP TinyShell).
  BTP:
    git: https://github.com/AlisonTristao/BTP.git
    version: v2.51.0
  TinyShell:
    git: https://github.com/AlisonTristao/TinyShell.git
    version: v2.2.0
  # Serial link over native USB (TinyUSB CDC); only chips with USB OTG.
  espressif/esp_tinyusb:
    version: "^2.0.1"
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
  # <name>.local for the TCP link.
  espressif/mdns:
    version: "^1.2"
  # The default file system (StorageConfig::fs).
  joltwallet/littlefs:
    version: "^1.14"
