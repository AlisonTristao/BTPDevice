version: "0.1.0"
description: "Makes an ESP32 a BTP device for TraceView: telemetry, terminal, commands, encryption and discovery by name."
url: https://github.com/AlisonTristao/BTPDevice
license: MIT
dependencies:
  idf: ">=6.0"
  # Serial link over native USB (TinyUSB CDC); only chips with USB OTG.
  espressif/esp_tinyusb:
    version: "^2.0.1"
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
  # <name>.local for the TCP link.
  espressif/mdns:
    version: "^1.2"
