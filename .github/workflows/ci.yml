# Host tests on every push, plus an ESP-IDF build of every test app and
# example. BTP and TinyShell are fetched from GitHub at the tags pinned in
# idf_component.yml (component manager) and test/host/CMakeLists.txt
# (FetchContent). The checkout goes to a folder named TraceKit because ESP-IDF
# names the component after its folder.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IDF_VERSION: v6.0.1

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: TraceKit
      - name: Configure
        run: cmake -S TraceKit/test/host -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Python tools
        run: |
          python -m py_compile TraceKit/tools/link_echo_test.py TraceKit/tools/pio_recovery.py TraceKit/tools/btp_term.py
          python TraceKit/tools/test_btp_ota.py

  idf-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - test_apps/build_smoke
          - test_apps/link_echo
          - examples/01_minimal
          - examples/02_weather_station
          - examples/03_relay_actuator
          - examples/04_ble_secure
          - examples/05_espnow_dongle
          - examples/06_recovery_s3
          - examples/07_sleep_sensor
          - recovery
        target:
          - esp32s3
    steps:
      - uses: actions/checkout@v4
        with:
          path: TraceKit
      - name: Build ${{ matrix.app }} (${{ matrix.target }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          path: TraceKit/${{ matrix.app }}
