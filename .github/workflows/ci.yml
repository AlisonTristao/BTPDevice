# Host tests on every push, plus an ESP-IDF build of every test app and
# example. BTP and TinyShell are checked out next to this repository, the same
# sibling layout test_apps/btpdev_components.cmake expects locally.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Minimum versions BTPDevice builds against (docs/PLANO.md D15). Bump in
  # the same commit that starts using something newer.
  BTP_REF: v2.49.0
  TINYSHELL_REF: v2.1.0
  IDF_VERSION: v6.0.1

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test/host -B test/host/build
      - name: Build
        run: cmake --build test/host/build
      - name: Test
        run: ctest --test-dir test/host/build --output-on-failure

  idf-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - test_apps/build_smoke
        target:
          - esp32s3
    steps:
      - uses: actions/checkout@v4
        with:
          path: BTPDevice
      - uses: actions/checkout@v4
        with:
          repository: AlisonTristao/BTP
          ref: ${{ env.BTP_REF }}
          path: BTP
      - uses: actions/checkout@v4
        with:
          repository: AlisonTristao/TinyShell
          ref: ${{ env.TINYSHELL_REF }}
          path: TinyShell
      - name: Build ${{ matrix.app }} (${{ matrix.target }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          path: BTPDevice/${{ matrix.app }}
