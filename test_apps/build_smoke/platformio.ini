; PlatformIO entry point for the same ESP-IDF project (CMakeLists.txt).
[platformio]
src_dir = main

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; Wi-Fi + lwIP + mDNS or NimBLE do not fit the 1 MB default app partition.
board_build.partitions = partitions.csv
