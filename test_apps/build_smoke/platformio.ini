; PlatformIO entry point for the same ESP-IDF project (CMakeLists.txt).
[platformio]
src_dir = main

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; Wi-Fi + lwIP + mDNS or NimBLE do not fit the 1 MB default app partition.
board_build.partitions = partitions.csv

; ESP32 (classic): no native USB, so Link::Serial runs on UART0 (the bridge).
; Build-only here too; the 8 MB layout just has to link.
[env:esp32]
platform = espressif32
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
