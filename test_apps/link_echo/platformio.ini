; One environment per link under test; all share sdkconfig.defaults.
;   pio run -d test_apps/link_echo -e serial -t upload
; Wi-Fi credentials for the TCP env: build_flags below or menuconfig.
[platformio]
src_dir = main

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
; Wi-Fi + lwIP + mDNS or NimBLE do not fit the 1 MB default app partition.
board_build.partitions = partitions.csv

[env:serial]
build_flags = -DECHO_LINK_SERIAL_FLAG

[env:tcp]
build_flags = -DECHO_LINK_TCP_FLAG
    '-DECHO_WIFI_SSID_FLAG="${sysenv.ECHO_WIFI_SSID}"'
    '-DECHO_WIFI_PASSWORD_FLAG="${sysenv.ECHO_WIFI_PASSWORD}"'

[env:ble]
build_flags = -DECHO_LINK_BLE_FLAG

[env:espnow]
build_flags = -DECHO_LINK_ESPNOW_FLAG
