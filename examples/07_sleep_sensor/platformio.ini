; pio run -d examples/07_sleep_sensor -t upload      app + recovery, over USB
; pio run -d examples/07_sleep_sensor -t uploadfs    data/ (bally.key, wifi.txt)
[platformio]
src_dir = main

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = ../../partitions/btpdev_16mb.csv
board_build.filesystem = littlefs
extra_scripts = post:../../tools/pio_recovery.py
