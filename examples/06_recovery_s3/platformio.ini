; pio run -d examples/06_recovery_s3 -t upload      app + recovery, over USB
; pio run -d examples/06_recovery_s3 -t uploadfs    data/ (bally.key, wifi.txt)
; python tools/btp_ota.py btpdev-s3-demo.local .pio/build/esp32-s3/firmware.bin
[platformio]
src_dir = main

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = ../../partitions/btpdev_16mb.csv
board_build.filesystem = littlefs
; Builds recovery/ for this chip (once) and flashes it into ota_0 with the app.
extra_scripts = post:../../tools/pio_recovery.py
