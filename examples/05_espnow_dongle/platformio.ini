; pio run -d examples/05_espnow_dongle -t upload      (firmware)
; pio run -d examples/05_espnow_dongle -t uploadfs    (the data/ folder -> LittleFS: key, wifi.txt)
[platformio]
src_dir = main

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
